# Fulcrum configuration for BLAKE2b support build
# https://github.com/privkeyio/Fulcrum

# *REQUIRED* Database directory
datadir = /home/fulcrum/db

# bitcoind RPC endpoint (container hostname:port)
bitcoind = bitcoind:8332

# Use bitcoind's .cookie file for RPC auth instead of rpcuser/rpcpassword
# The cookie file path must be accessible inside the Fulcrum container.
# It is provided by mounting the bitcoind data dir read-only.
rpccookie = /home/bitcoin/.bitcoin/.cookie

# Electrum TCP interface (matches the old electrs port 50001)
tcp = 0.0.0.0:50001

# Minimum RPC block fetch window (seconds). Keep default.
#polltime = 2.0

# Server banner
#banner = /path/to/banner.txt