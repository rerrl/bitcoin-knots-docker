# Lightning Fork (BLAKE2b) configuration for mainnet against bitcoind.
# https://github.com/paulscode/lightning-fork
#
# This file is baked into the image at /home/lnd/lnd.conf and passed to lnd via
# --configfile. Override it by mounting a custom file over that path.

[Application Options]

# Bind on all interfaces so the published ports work.
listen=0.0.0.0:9735
rpclisten=0.0.0.0:10009
restlisten=0.0.0.0:8080

# Extra SAN for the auto-generated TLS certificate so it validates as "lnd"
# from other containers on the compose network.
tlsextradomain=lnd

# The wallet is created and unlocked manually; there is no wallet password in
# this file.
# First run with:  lncli create
# After restart:   lncli unlock

[Bitcoin]

bitcoin.active=1
bitcoin.mainnet=1
bitcoin.node=bitcoind

[Bitcoind]

# bitcoind container hostname / RPC port (ZMQ ports are published by bitcoind).
bitcoind.rpchost=bitcoind:8332

# Authenticate with bitcoind's cookie, provided by mounting the bitcoind data
# dir read-only. No rpcuser/rpcpass secrets are stored here.
bitcoind.rpccookie=/home/bitcoin/.bitcoin/.cookie

# Raw block/transaction ZMQ streams from bitcoind.
bitcoind.zmqpubrawblock=tcp://bitcoind:28332
bitcoind.zmqpubrawtx=tcp://bitcoind:28333